# Sources are grouped by acquisition method.
#
# Use one named table per source:
# - [rss."source.id"]
# - [api."source.id"]
# - [scrape."source.id"]
# - [fixture."source.id"]
#
# Minimal RSS example:
# [rss."hackernews.best"]
# name = "Hacker News Best"
# tags = ["community", "news"]
# feed_url = "https://hnrss.org/best"
# article_fetch_enabled = false
#
# Self-hosted RSSHub base override:
# AINFORMER_RSSHUB_BASE_URL=http://127.0.0.1:1200

[api."huggingface.papers"]
name = "Hugging Face Papers"
tags = ["papers", "research"]
url = "https://huggingface.co/api/daily_papers"
items_path = "$"
external_id_field = "paper.id"
title_field = "title"
url_template = "https://huggingface.co/papers/{paper.id}"
canonical_url_template = "https://huggingface.co/papers/{paper.id}"
published_at_field = "publishedAt"
authors_field = "paper.authors"
tags_field = "paper.ai_keywords"
excerpt_field = "summary"
content_text_field = "summary"

[rss."arxiv.ai"]
name = "arXiv AI"
tags = ["papers", "research", "arxiv", "ai"]
feed_url = "https://export.arxiv.org/api/query?search_query=cat:cs.AI&start=0&max_results=50&sortBy=submittedDate&sortOrder=descending"
article_fetch_enabled = false

