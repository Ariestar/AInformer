name: deploy

on:
  # 不在 push 上直接部署：等 ci 跑完再看结果，只有成功才继续
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # 每天 22:00 UTC（北京时间 06:00）抓一轮，站点不依赖本地机器
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    # 定时与手动触发没有上游 run，直接跑；workflow_run 则要求 ci 成功
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # 全部来自仓库 secrets，由 `gh secret set --env-file .env` 从本地 .env 同步。
      # 缺失时 config.py 会用默认值；AINFORMER_BASE_URL 缺失则构建直接失败。
      AINFORMER_BASE_URL: ${{ secrets.AINFORMER_BASE_URL }}
      AINFORMER_SITE_NAME: ${{ secrets.AINFORMER_SITE_NAME }}
      AINFORMER_SITE_DESC: ${{ secrets.AINFORMER_SITE_DESC }}
      AINFORMER_FEED_LIMIT: ${{ secrets.AINFORMER_FEED_LIMIT }}
      AINFORMER_FEED_PER_SOURCE: ${{ secrets.AINFORMER_FEED_PER_SOURCE }}
      AINFORMER_USER_AGENT: ${{ secrets.AINFORMER_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 触发时默认检出的是默认分支最新提交，不一定是刚过 CI 的那个
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: uv sync --frozen

      - name: fetch sources
        run: uv run python bin/fetch.py
      - name: export contract
        run: uv run python bin/export.py

      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web

      - name: build feed
        run: uv run python bin/build_feed.py --base-url "$AINFORMER_BASE_URL"

      - name: verify credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          echo "token length ${#CF_TOKEN}, account ${CF_ACCOUNT:0:8}..."

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          packageManager: bun
          # 项目名不在这里写死，由 wrangler.toml 的 name 决定
          command: pages deploy out --branch main
