name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check bin tests
      - run: uv run ruff format --check bin tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: uv sync --frozen
      # 构建需要数据，CI 用固定 fixture，避免依赖外网源是否可用
      - name: generate data from fixture
        run: uv run python bin/export.py --in tests/fixtures/items.json
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun run test
        working-directory: web
      - run: bun run build
        working-directory: web
