# ── 论文 ──────────────────────────────────────────
# 注意端点：export.arxiv.org 现在返回空 feed，必须用 rss.arxiv.org。
# cs.RO 每天上百条，用 max_per_source 单独压到 15，避免刷屏。

[[source]]
id = "arxiv_cs_ro"
name = "arXiv cs.RO"
tier = "media"
weight = 0.5
max_per_source = 15
url = "https://rss.arxiv.org/rss/cs.RO"

# ── 媒体源：只做交叉验证，不作事实依据 ────────────
[[source]]
