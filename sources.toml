url = "https://www.qbitai.com/feed"

# ── 聚合源：二手精选，只作线索，不作事实依据 ──────
# 它们本身就是对官方源和社交媒体的转述与筛选，信息增量有限，
# 但能补上你的源清单里没有的东西：X/KOL、国内媒体、中文语境下的取舍。
# 代价是重复度会明显上升 —— 这是 triage.py 的重复簇要解决的问题。

[[source]]
id = "aihot"
name = "AIHOT"
tier = "aggregator"
weight = 0.6
# 注意：原域名 aihot.virxact.com 已废弃，旧地址 2026-10 起停用。
# 旧 feed 里会留一条换域名通知，那是历史条目，不是新内容。
url = "https://aihot.news/rss.xml"

[[source]]
id = "juya_daily"
name = "橘鸦AI早报"
tier = "aggregator"
weight = 0.6
# 粒度特殊：一天一期日报，一期 = 一条 feed item，不是单条新闻。
# 所以条目数永远很少（约 10 条 = 10 天），但每条背后是当天几十条资讯。
# 当线索源用：看到值得追的，点进去再找原始出处。
url = "https://daily.juya.uk/rss.xml"

# ── 公众号（经 wechat2rss 转换） ──────────────────
# 公众号没有官方 RSS，这些地址来自 BestBlogs 维护的 wechat2rss 实例，
# OPML 清单：github.com/ginobefun/BestBlogs/blob/main/opml/bestblogs_wechat2rss_opml_all.opml
# （共 375 个号，含 AI 前线、AI 科技评论等，需要时从里面加）
#
# 内容本身是一手的（这些号自己采写），所以 tier 仍是 media；
# 但传输层是第三方转换，**转换器挂了是静默的** —— 表现为源长期零新增。
# health.py 的"连续 3 次零新增"就是为这种情况准备的，别把它当误报。
# 每个 feed 只给最近 10 篇，且内嵌全文 HTML（单个 0.3–1.6 MB），抓取会慢一些。

