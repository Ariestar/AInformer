# 源清单 —— 唯一需要日常修改的文件
# 只收有 RSS/Atom 的源。没有 feed 的一律不收，不做 HTML 抓取兼容。
# 2026-10-23 实测全部 HTTP 200。

version = 1

[fetch]
days = 7              # 默认时间窗（天）
timeout = 20
max_per_source = 60   # 单源上限，只防极端情况，不做筛选
user_agent = "ai-intel/1.0"

[filter]
# 留空：抓取层不再替人做任何取舍。
# 需要屏蔽某类消息时，在页面上的筛选框里操作，或在这里加关键词。
blacklist = []

# ── 官方源：一手事实 ──────────────────────────────
[[source]]
id = "openai_news"
name = "OpenAI News"
tier = "official"
weight = 1.0
url = "https://openai.com/news/rss.xml"

