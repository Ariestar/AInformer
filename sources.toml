# ── 具身 / 机器人 ──────────────────────────────────
# 中文机器人垂直媒体基本都没有可用 RSS（智东西 500、高工机器人证书错误、
# 机器人大讲堂只有公众号），所以这块以英文源 + arXiv 论文为主。

[[source]]
id = "ieee_spectrum_robotics"
name = "IEEE Spectrum Robotics"
tier = "media"
weight = 0.8
url = "https://spectrum.ieee.org/feeds/topic/robotics.rss"

[[source]]
id = "techxplore_robotics"
name = "TechXplore Robotics"
tier = "media"
weight = 0.75
url = "https://techxplore.com/rss-feed/robotics-news/"

[[source]]
id = "sciencedaily_robotics"
name = "ScienceDaily Robotics"
tier = "aggregator"
weight = 0.55
# 机构新闻稿聚合，量大且偏软；压到 20 条，避免淹没一手源。
max_per_source = 20
url = "https://www.sciencedaily.com/rss/computers_math/robotics.xml"

# ── 深度分析 / 技术 newsletter ────────────────────
# 定位：硬核、专业，但讲得清楚，非纯论文。质量高、更新不频繁，不吵。

[[source]]
id = "ahead_of_ai"
name = "Ahead of AI"
tier = "media"
weight = 0.8
# Sebastian Raschka 的技术长文，模型/训练深度解读，教程式。
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36"
url = "https://magazine.sebastianraschka.com/feed"

[[source]]
id = "interconnects"
name = "Interconnects"
tier = "media"
weight = 0.75
# Nathan Lambert 的 LLM 研究评论，一线视角。
url = "https://www.interconnects.ai/feed"

