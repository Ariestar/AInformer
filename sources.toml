# 源清单 —— 唯一需要日常修改的文件
# 只收有 RSS/Atom 的源。没有 feed 的一律不收，不做 HTML 抓取兼容。
# 2026-10-23 实测全部 HTTP 200。

version = 1

[fetch]
days = 60             # 默认时间窗（天）；可用 AINFORMER_FETCH_DAYS 全局覆盖
timeout = 20
max_per_source = 60   # 单源上限，只防极端情况，不做筛选
user_agent = "ainformer/1.0"

[filter]
# 留空：抓取层不再替人做任何取舍。
# 需要屏蔽某类消息时，在页面上的筛选框里操作，或在这里加关键词。
blacklist = []

