[project]
name = "ainformer"
version = "0.1.0"
description = "AI 行业情报系统：多源抓取 → 判断 → 静态站点 + RSS"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bin", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PTH",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "export", "fetch", "health", "triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bin"]
