[project]
name = "ainformer"
version = "0.1.0"
description = "Foundation for a unified AI news ingestion service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
ainformer = "ainformer.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainformer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

